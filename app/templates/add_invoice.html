{% extends "layout.html" %}
{% block content %}
<h2>Add Invoice</h2>
<form method="POST" action="{{ url_for('add_invoice') }}">
    <label for="vendor-input">Vendor Name</label><br>
    <input type="text" id="vendor-input" name="vendor" required>
    <br>
    <label for="amount-input">Amount</label><br>
    <input type="number" step="0.01" id="amount-input" name="amount" required>
    <br>
    <label for="due-date-input">Due Date</label><br>
    <input type="date" id="due-date-input" name="due_date" required>
    <br><br>
    <button type="submit" id="submit-invoice-btn">Submit Invoice</button>
</form>
<br>
<a href="{{ url_for('list_invoices') }}" id="nav-back-list">Back to List</a>
{% endblock %}
